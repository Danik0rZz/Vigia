# Puerta sin IA (ADR-0007) en Windows. Sin test:live ni secretos: los logs de un repositorio
# público son públicos. El zip no se sube (publicarlo lo decide Dani).
#
# Ficha 0072: también corre en cada PR a main, sin filtro de rutas, para que el check «CI ok» exista
# siempre (es el que exigirá la protección de main). Tres jobs: `cambios` decide con
# scripts/ci-changes.mjs si la PR trae algo más que documentos (la lista de lo que no cuenta vive
# en ese script; el paths-ignore del push tiene que coincidir con ella), `windows` pasa check y el
# e2e completo solo si hay código (el zip solo fuera de las PR) y `ci-ok` da verde si nada falló
# ni se canceló.
#
# Ficha 0073: se integra por PR (ramas integra/…, de 3 a 5 fichas). El e2e completo pasa en cada PR
# (y a mano); el push a main, que solo llega al fusionar una PR, pasa check (para cazar dos PR que
# pasaron cada una por su lado y fallan juntas) y dist:win, sin e2e. Las ramas integra/ no lanzan
# el CI al subirlas: solo sus PR.
#
# Ficha 0056: cada acción va fijada por SHA de commit, con su versión en el comentario (una etiqueta
# la puede mover su dueño o quien le robe la cuenta). Al subir una acción se cambia aquí, en
# audit.yml y en la tabla PINNED de scripts/ci-workflow.test.ts.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# En main los runs se encolan, no se cancelan: la fusión de una PR no debe cancelar el CI de la
# fusión anterior (cada una puede romper con lo que ya había). En una PR solo cuenta el último
# push: el nuevo cancela el run anterior de esa misma PR (github.ref es refs/pull/N/merge).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cambios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      codigo: ${{ steps.cambios.outputs.codigo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El commit de fusión de la PR y su primer padre (main).
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: ¿Trae código?
        id: cambios
        run: node scripts/ci-changes.mjs

  windows:
    needs: [cambios]
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # affected-e2e y sus tests leen el historial.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Instalación del README: sin scripts (better-sqlite3 no necesita compilar) y Electron aparte.
      - run: npm ci --ignore-scripts
      # Lo que va dentro del zip: bloqueante desde "high".
      - name: npm audit (producción)
        run: npm audit --omit=dev --audit-level=high
      # Dependencias de desarrollo: solo para ver el ruido, no para el CI.
      - name: npm audit (desarrollo)
        run: npm audit --audit-level=critical
        continue-on-error: true
      # Caché de @electron/get (%LOCALAPPDATA%\electron\Cache): el zip de Electron, unos 100 MB, que
      # usan install-electron y electron-builder. La clave lleva la versión de package.json.
      - name: Caché de Electron
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-44.5.1
      - run: npx install-electron
      - run: npm run check
      # El e2e completo, en las PR y a mano; en el push a main ya pasó en su PR.
      - if: github.event_name != 'push'
        run: npm run test:e2e
      # Solo test-results/ de Playwright (captura y final del log de main de e2e/failure-capture.ts).
      # Los e2e usan servidores simulados: no hay datos del tenant ni secretos (el CI no tiene
      # .env.live.local ni test:live).
      - name: Artefactos de e2e fallidos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      # El zip solo en el push a main (y a mano), no en las PR.
      - if: github.event_name != 'pull_request'
        run: npm run dist:win

  # El único check que exigirá la protección de main: siempre se ejecuta, también si windows se
  # saltó porque la PR solo trae documentos. Rojo si algún job falló o se canceló.
  ci-ok:
    name: CI ok
    if: always()
    needs: [cambios, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Algún job falló o se canceló
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "cambios ${{ needs.cambios.result }}, windows ${{ needs.windows.result }}"
