# Revisión semanal de vulnerabilidades (ficha 0056): los mismos dos npm audit que ci.yml, para que
# un aviso nuevo se vea aunque no haya pushes. Sin Dependabot: abre PRs y el flujo no trabaja con
# PRs. Acciones fijadas por SHA como en ci.yml.
name: Auditoría semanal

on:
  schedule:
    # Lunes a las 06:17 UTC (minuto no redondo: a en punto GitHub retrasa los cron).
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm audit (producción)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (desarrollo)
        run: npm audit --audit-level=critical
        continue-on-error: true
