appId: com.vigia.app
productName: Vigía
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  # De better-sqlite3 solo hace falta el binario de Windows x64.
  - '!node_modules/better-sqlite3/{src,deps,docs,benchmark}/**'
  - '!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*.node'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
asar: true
# Los módulos nativos no se pueden cargar desde dentro del asar.
asarUnpack:
  - '**/*.node'
# Migraciones de la base local; main las aplica al arrancar.
extraResources:
  - from: src/main/db/migrations
    to: migrations
# Solo se incluyen los idiomas de Chromium que usa la app.
electronLanguages:
  - es
  - en-US
win:
  executableName: vigia
  target:
    - target: zip
      arch:
        - x64
  artifactName: vigia-${version}-win-x64.${ext}
portable:
  artifactName: vigia-${version}-portable.${ext}
# Fusibles de Electron: cierran formas de ejecutar código ajeno con el binario de la app.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
npmRebuild: false
publish: null
