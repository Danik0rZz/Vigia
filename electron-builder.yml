appId: com.vigia.app
productName: Vigía
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
# Solo se incluyen los idiomas de Chromium que usa la app.
electronLanguages:
  - es
  - en-US
win:
  executableName: vigia
  target:
    - target: zip
      arch:
        - x64
  artifactName: vigia-${version}-win-x64.${ext}
portable:
  artifactName: vigia-${version}-portable.${ext}
# Fusibles de Electron: cierran formas de ejecutar código ajeno con el binario de la app.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
npmRebuild: false
publish: null
